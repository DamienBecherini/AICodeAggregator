# Configuration pour le script de concaténation de projet.
# Listez ici tous les répertoires, extensions ou fichiers spécifiques à ignorer.

# Répertoires à exclure entièrement (le nom du dossier suffit).
exclude_dirs:
  - .git
  - node_modules
  - build
  - dist
  - .vscode
  - __pycache__
  - .idea
  - venv

# Extensions de fichiers à exclure (n'oubliez pas le point au début).
exclude_extensions:
  - .log
  - .tmp
  - .bak
  - .swp
  - .exe
  - .dll
  - .so
  - .lock
  - .env
  - .png
  - .jpg
  - .jpeg
  - .gif
  - .svg
  - .ico
  - .pdf
  - .zip
  - .rar
  - .gz

# Noms de fichiers spécifiques à exclure.
exclude_files:
  - concatenate-project.ps1
  - concat-config.yaml
  - package-lock.json
  - yarn.lock
